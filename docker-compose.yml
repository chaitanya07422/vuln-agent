services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VULN_AGENT_MONGO_URI: mongodb://mongo:27017
      VULN_AGENT_CONFIG: /app/config/default.yaml
    volumes:
      - ./config:/app/config:ro
      - ./playbooks:/app/playbooks:ro
    depends_on:
      - mongo
    command: uvicorn vuln_agent.main:app --host 0.0.0.0 --port 8000

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
