[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-agent"
version = "0.1.0"
description = "URL-only multi-agent vulnerability scanner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "python-multipart>=0.0.9",
  "motor>=3.5.0",
  "arq>=0.26.0",
  "PyJWT>=2.8.0",
  "redis>=5.0.0",
]

[tool.setuptools.package-data]
vuln_agent = ["web/*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "anyio>=4.0.0",
]

[project.scripts]
vuln-agent = "vuln_agent.main:run"
scanlead-mcp = "vuln_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vuln_agent*", "vuln_agent_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
