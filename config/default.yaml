enabled_agents:
  - recon
  - users
  - auth
  - leaks
  - cors_api
  - upload
  - uat_app
  - ports_mail
  - adapt
  - reporter

limits:
  max_rps: 5
  request_timeout_sec: 15
  scan_timeout_sec: 180

http:
  user_agent: "vuln-agent/0.1 (+authorized-scan)"
  follow_redirects: true
  max_redirects: 5

# Providers activate only when API keys are present; otherwise NullLLM.
llm:
  lead: claude
  adapt: gemini-flash
  reporter: claude
  fallback: openai
