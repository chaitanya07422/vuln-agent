enabled_agents:
  - recon
  - users
  - auth
  - leaks
  - cors_api
  - upload
  - js_audit
  - uat_app
  - ports_mail
  - tls_headers
  - cloud_storage
  - admin_panels
  - email_spoof
  - js_secrets
  - sitemap_crawl
  - graphql
  - websocket
  - cookie_flags
  - oauth_misconfig
  - jwt_public
  - redirect_open
  - http_methods
  - cors_creds
  - subdomain_hint
  - dns_hygiene
  - caa_dnssec
  - cdn_origin
  - wordpress_deep
  - next_react
  - spring_java
  - firebase
  - cache_poison_hint
  - rate_limit_probe
  - dependency_meta
  - input_hygiene
  - adapt
  - compliance_map
  - executive_brief
  - reporter

limits:
  max_rps: 7
  request_timeout_sec: 15
  scan_timeout_sec: 360

http:
  user_agent: "vuln-agent/0.1 (+authorized-scan)"
  follow_redirects: true
  max_redirects: 5

# Providers activate only when API keys are present; otherwise NullLLM.
# Gemini is used for Adapt probes + finding explanations/report polish when set.
llm:
  lead: claude
  adapt: gemini-flash
  reporter: gemini-flash
  fallback: gemini-flash
